services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crushai
      POSTGRES_PASSWORD: crushai_dev_pw
      POSTGRES_DB: crushai
    ports:
      - "5432:5432"
    volumes:
      - crushai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crushai"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedding-service:
    build:
      context: ./embedding-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      embedding-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://crushai:crushai_dev_pw@db:5432/crushai
      JWT_SECRET: change_this_to_a_long_random_string
      PORT: 4000
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - crushai_uploads:/app/uploads

volumes:
  crushai_pgdata:
  crushai_uploads:
