# Render.com deployment blueprint — https://render.com/docs/blueprint-spec
# One-time setup: render.com → New → Blueprint → point at this repo.
# After the first deploy, open the "crushai-backend" service's Shell tab once
# and run `npm run migrate` (or set it as a Pre-Deploy Command in the dashboard).
#
# ⚠️ Verify pgvector is enabled on the Postgres instance (Render dashboard →
# your database → Extensions) before the first deploy — search/visual will
# fail with a Postgres error otherwise.

databases:
  - name: crushai-db
    plan: free
    databaseName: crushai
    user: crushai

services:
  - type: web
    name: crushai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crushai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Fill this in with your real onrender.com URL (or custom domain) once
      # you know it — same-origin requests (the web/ app calling its own
      # backend) don't need this at all, it's only for other origins.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMBEDDING_SERVICE_URL
        fromService:
          type: web
          name: crushai-embeddings
          property: hostport
      # Object storage (fill in once you have an R2/S3 bucket — see backend/.env.example):
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

  # Render's free tier only supports "web" services (not Private Services),
  # so this is public — it has no auth of its own. Fine for an MVP; revisit
  # if that becomes a concern (e.g. put it behind a shared-secret header).
  - type: web
    name: crushai-embeddings
    runtime: docker
    dockerfilePath: ./embedding-service/Dockerfile
    dockerContext: ./embedding-service
    plan: free
    healthCheckPath: /health
